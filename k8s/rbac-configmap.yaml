      "name_en": "Mr. Mongkol Petsawang",
      "student_id": "68130712",
      "short_id": "712",
      "program": "วิศวกรรมศาสตรมหาบัณฑิต สาขาวิชาวิศวกรรมคอมพิวเตอร์",
      "university": "วิทยาลัยวิศวกรรมศาสตร์และเทคโนโลยี มหาวิทยาลัยธุรกิจบัณฑิตย์ (DPU)",
      "course": "CT665 คูเบอร์เนเทสและเซิร์ฟเวอร์เลส (Lab Exam)",
      "email": "68130712@dpu.ac.th",
      "bio": "นักศึกษาปริญญาโท สาขาวิชาวิศวกรรมคอมพิวเตอร์ มุ่งเน้นการออกแบบระบบคลาวด์เนทีฟ Kubernetes Microservices และการแสดงผลข้อมูลกฎหมายสามมิติ (Neural of Law)"
    }
  research.json: |
    {
      "title": "การออกแบบและประเมินระบบแสดงภาพกฎหมายสามมิติเชิงเครือข่ายประสาท (Neural of Law) เพื่อการสำรวจโครงสร้าง ลำดับศักดิ์ และความสัมพันธ์ของกฎหมายไทย กรณีศึกษากฎหมายภาษีอากร",
      "author": "นายมงคล เพชรแสวง (รหัสนักศึกษา 68130712)",
      "course": "วิชาสัมมนาทางวิศวกรรมคอมพิวเตอร์ — มหาวิทยาลัยธุรกิจบัณฑิตย์",
      "keywords": "Neural of Law, 3D Legal Visualization, WebAssembly, WebGL2, Thai Tax Law, Legal Knowledge Graph, RAG Agent",
      "summary": "กฎหมายไทยในปัจจุบันถูกจัดเก็บและเผยแพร่ในรูปแบบเอกสารตัวอักษรเรียงตามมาตรา ทำให้การสืบค้นผ่านเว็บไซต์หน่วยงานภาครัฐแสดงผลเป็นเพียงรายการเอกสารทีละหน้า ไม่สะท้อนให้เห็นว่ากฎหมายแต่ละฉบับอยู่ระดับใดของลำดับศักดิ์ สังกัดหน่วยงานใด หรือมีความสัมพันธ์เชิงให้อำนาจ แก้ไข ยกเลิก และอ้างอิงต่อกันอย่างไร งานวิจัยนี้จึงนำเสนอการออกแบบและประเมินระบบ Neural of Law ซึ่งเป็นการแสดงภาพกฎหมายสามมิติเชิงเครือข่ายประสาท โดยใช้กฎหมายภาษีอากรตามประมวลรัษฎากรเป็นกรณีศึกษา\n\nการวิจัยดำเนินตามแนวทาง Design Science Research (DSR) แบ่งออกเป็น 4 องค์ประกอบหลัก ได้แก่ 1) การเข้ารหัสภาพ (Visual Encoding) และแบบจำลองข้อมูล 7 ระดับ ที่แปลงลำดับศักดิ์ของกฎหมายไทยเป็นความสูงในแกนตั้ง แปลงสังกัดกระทรวงและกรมเป็นการจัดกลุ่มเชิงพื้นที่ แปลงความสำคัญจากค่า PageRank เป็นขนาดโหนด และแปลงความสัมพันธ์ทางกฎหมาย 11 ชนิดเป็นเส้นเชื่อมที่มีทิศทาง น้ำหนักแบบ noisy-or และความใหม่ของข้อมูล 2) แกนประมวลผลสมรรถนะสูงที่พัฒนาด้วยภาษา Rust คอมไพล์เป็น WebAssembly ทำงานร่วมกับการเรนเดอร์ผ่าน WebGL2 บนเว็บเบราว์เซอร์ทั่วไป ทำให้สามารถวาดคลังกฎหมายขนาดใหญ่จำนวน 2,372 โหนด และเส้นเชื่อมความสัมพันธ์ 5,867 เส้น ได้อย่างลื่นไหลด้วยคำสั่งวาดเพียง 3 คำสั่ง 3) การประเมินเชิงประจักษ์กับผู้ใช้งาน เพื่อเปรียบเทียบความเร็วและความถูกต้องในการตอบคำถามเชิงโครงสร้างระหว่างระบบภาพสามมิติกับระบบสืบค้นแบบรายการ และ 4) การออกแบบบรรณารักษ์กฎหมาย (Legal Librarian Agent) ซึ่งเป็นซอฟต์แวร์เอเจนต์แบบค้นก่อนตอบ (Retrieval-First) ที่มีเครื่องมืออ่านคลังข้อมูลอย่างเดียว 3 ชนิด สามารถตอบคำถามพร้อมอ้างอิงเลขมาตราที่ตรวจสอบย้อนกลับได้ และนำทางมุมกล้องบนหน้าจอสามมิติไปยังโหนดที่เกี่ยวข้องโดยตรง\n\nผลลัพธ์จากงานวิจัยนี้แสดงให้เห็นว่าการแปลงโครงสร้างกฎหมายจากตัวอักษรเป็นพื้นที่สามมิติที่มีความหมายทางกฎหมาย ช่วยลดภาระการเปิดเอกสารข้ามไปมา เพิ่มความเข้าใจภาพรวมลำดับศักดิ์และเครือข่ายการอ้างอิงของกฎหมายภาษีอากรไทยได้อย่างมีประสิทธิภาพ พร้อมเป็นต้นแบบสำหรับขยายผลสู่กฎหมายสาขาอื่นในอนาคต"
    }
