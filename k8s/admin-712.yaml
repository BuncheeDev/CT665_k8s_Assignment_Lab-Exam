apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-712
  labels:
    app: admin-712
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-712
  template:
    metadata:
      labels:
        app: admin-712
    spec:
      serviceAccountName: lab-exam-sa
      containers:
        - name: admin-712
          image: admin-712:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: admin-712
spec:
  type: ClusterIP
  selector:
    app: admin-712
  ports:
    - port: 80
      targetPort: 8080
